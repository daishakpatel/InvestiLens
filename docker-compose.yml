# Local infrastructure only. API and worker services are added in Phase 4a / 5d.
services:
  postgres:
    image: pgvector/pgvector:pg16  # Postgres 16 + pgvector (ADR-0002)
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-investilens}
      POSTGRES_USER: ${POSTGRES_USER:-investilens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-investilens}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # Observability stack (ADR-0021). Optional — the app works without it (console-exported traces,
  # /metrics scrapeable directly). Bring up with `docker compose --profile observability up`.
