# Full local stack (Phase 5d): infra + api + per-queue workers + beat + object storage + frontend.
# `make up` on a fresh clone brings the whole system up (NFR-012, <15 min target).
#
# The backend image is shared by the api, workers, beat, and migrate services — only the command
# differs (JOB-003: one queue per worker so concurrency is tuned per workload).

x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-investilens}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-investilens}
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  PROVIDER_MODE: ${PROVIDER_MODE:-mock}
  BACKGROUND_JOBS_ENABLED: "true"
  CACHE_ENABLED: "true"
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_BACKEND: redis
  OBJECT_STORAGE_BACKEND: s3
  OBJECT_STORAGE_ENDPOINT: minio:9000
  OBJECT_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-investilens}
  OBJECT_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-investilens-dev-secret}
  # Dev default matches app/config.py; a real deploy MUST override via env (SEC-001).
  JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-change-me-32-bytes-minimum-secret}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
  TIINGO_API_KEY: ${TIINGO_API_KEY:-}
  FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}

x-backend-build: &backend-build
  context: .
  dockerfile: backend/Dockerfile

services:
  postgres:
    image: pgvector/pgvector:pg16  # Postgres 16 + pgvector (ADR-0002)
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-investilens}
      POSTGRES_USER: ${POSTGRES_USER:-investilens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-investilens}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:latest  # S3-compatible object storage for raw filings (ADR-0012)
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-investilens}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-investilens-dev-secret}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 10

  # One-shot: bring the schema to head before api/workers start (NFR-012 fresh-clone bootstrap).
  migrate:
    build: *backend-build
    environment: *backend-env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: *backend-build
    environment: *backend-env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health"]
      interval: 10s
      retries: 5

  # Per-queue workers (JOB-003): interactive runs higher concurrency for snappy report gen;
  # ingestion/batch run modestly so a nightly backfill never monopolizes CPU.
  worker-interactive:
    build: *backend-build
    environment: *backend-env
    command: ["celery", "-A", "app.tasks.celery_app", "worker", "-Q", "interactive", "-c", "4", "-n", "interactive@%h"]
    depends_on:
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}

  worker-ingestion:
    build: *backend-build
    environment: *backend-env
    command: ["celery", "-A", "app.tasks.celery_app", "worker", "-Q", "ingestion", "-c", "2", "-n", "ingestion@%h"]
    depends_on:
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}

  worker-batch:
    build: *backend-build
    environment: *backend-env
    command: ["celery", "-A", "app.tasks.celery_app", "worker", "-Q", "batch", "-c", "1", "-n", "batch@%h"]
    depends_on:
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}

  beat:
    build: *backend-build
    environment: *backend-env
    command: ["celery", "-A", "app.tasks.celery_app", "beat", "--loglevel=info"]
    depends_on:
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}

  frontend:
    image: node:24-slim
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --port 5173"
    environment:
      VITE_DEV_PROXY_TARGET: http://api:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - api

  # Observability stack (ADR-0021). Optional — `docker compose --profile observability up`.
  prometheus:
    image: prom/prometheus:latest
    profiles: ["observability"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.rules.yml:/etc/prometheus/alerts.rules.yml:ro
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:latest
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - prometheus

volumes:
  pgdata:
  miniodata:
