[project]
name = "investilens-backend"
version = "0.1.0"
description = "InvestiLens API, workers, and data pipeline"
requires-python = ">=3.12,<3.13"
# Runtime dependencies are added by the phase that first needs them (see docs/decisions/).
dependencies = [
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",       # psycopg 3 driver (DATABASE_URL uses postgresql+psycopg)
    "pgvector>=0.3.6",            # Vector column type + operators (ADR-0002, ADR-0010)
    "pydantic[email]>=2.9",       # [email] adds EmailStr validation at the input boundary
    "pydantic-settings>=2.6",     # typed env config (spec §20 mandates Pydantic v2)
    "fastapi>=0.115",             # API framework + OpenAPI 3.1 generation (spec §24)
    "httpx>=0.27",                # SEC EDGAR client with timeouts (spec §20); also TestClient
    "pyyaml>=6.0",                # concept maps / sector applicability are YAML config (DR-020)
    "selectolax>=0.3.21",         # fast lexbor HTML parsing for multi-MB SEC filings (spec 20)
    "argon2-cffi>=23.1",          # Argon2id password hashing (AUTH-001, ADR-0005)
    "pyjwt>=2.9",                 # HS256 access-token JWTs (AUTH-002, ADR-0005; not python-jose)
    "structlog>=26.1.0",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "prometheus-client>=0.26.0",
    "redis>=8.1.0",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",            # coverage gate on finance/ (DoD, NFR-013)
    "hypothesis>=6.100",          # property-based tests for the metric formulas
    "ruff>=0.6",
    "types-pyyaml>=6.0.12.20260906",
    "uvicorn[standard]>=0.30",
    "pip-audit>=2.10.1",
    "fakeredis>=2.39.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # asserts are the point of tests

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

# Coverage is NOT wired into the default `pytest` run (keeps `make check` fast); the gate is
# enforced by `make coverage` and the CI backend job (DoD, NFR-013). See ADR-0019.
[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",  # Protocol/ABC stubs
]
