# Canonical metric -> ordered list of XBRL tags (first available wins; record source_tag).
# Source: spec Appendix B (DR-020). Versioned: changing selections bumps to concept_map_v2.
# `kind` tells the selector how to match a period: `flow` = duration fact; `stock` = instant.
version: v1

flow_metrics:
  revenue:
    - us-gaap:Revenues
    - us-gaap:RevenueFromContractWithCustomerExcludingAssessedTax
    - us-gaap:RevenueFromContractWithCustomerIncludingAssessedTax
    - us-gaap:SalesRevenueNet
  cost_of_revenue:
    - us-gaap:CostOfRevenue
    - us-gaap:CostOfGoodsAndServicesSold
  gross_profit:
    - us-gaap:GrossProfit
  operating_income:
    - us-gaap:OperatingIncomeLoss
  net_income:
    - us-gaap:NetIncomeLoss
    - us-gaap:ProfitLoss
  operating_cash_flow:
    - us-gaap:NetCashProvidedByUsedInOperatingActivities
  capex:
    - us-gaap:PaymentsToAcquirePropertyPlantAndEquipment
    - us-gaap:PaymentsToAcquireProductiveAssets
  depreciation_amortization:
    - us-gaap:DepreciationDepletionAndAmortization
    - us-gaap:DepreciationAndAmortization
  stock_based_compensation:
    - us-gaap:ShareBasedCompensation
  eps_diluted:
    - us-gaap:EarningsPerShareDiluted
  shares_diluted_weighted:
    - us-gaap:WeightedAverageNumberOfDilutedSharesOutstanding
  # Effective tax rate for TTM ROIC (Phase 7b); reported by every fixture company.
  income_tax_expense:
    - us-gaap:IncomeTaxExpenseBenefit
  pretax_income:
    - us-gaap:IncomeLossFromContinuingOperationsBeforeIncomeTaxesExtraordinaryItemsNoncontrollingInterest
  # Earnings-quality inputs (Phase 7d, ADR-0042): appended, existing selections unchanged.
  sga_expense:
    - us-gaap:SellingGeneralAndAdministrativeExpense
  # Depreciation alone (Beneish DEPI), not D&A; companies disclose it in the 10-K PP&E note.
  depreciation:
    - us-gaap:Depreciation

# Flow metrics a 10-Q reports year-to-date (the cash-flow statement), not per quarter. Their
# quarters are de-cumulated: Q2 = 6M YTD - 3M YTD, Q3 = 9M - 6M, Q4 = FY - 9M (FR-QT-002).
cash_flow_metrics:
  - operating_cash_flow
  - capex
  - depreciation_amortization
  - stock_based_compensation

# Flows reported only in the 10-K (a note, not a statement line): no quarters to build or miss.
annual_only_metrics:
  - depreciation

stock_metrics:
  shares_outstanding:
    - dei:EntityCommonStockSharesOutstanding
  cash_and_equivalents:
    - us-gaap:CashAndCashEquivalentsAtCarryingValue
    - us-gaap:CashCashEquivalentsRestrictedCashAndRestrictedCashEquivalents
  short_term_investments:
    - us-gaap:MarketableSecuritiesCurrent
    - us-gaap:ShortTermInvestments
    - us-gaap:DebtSecuritiesCurrent  # NVIDIA's tag from FY2026 (Phase 7d; fills a gap only)
  total_assets:
    - us-gaap:Assets
  current_assets:
    - us-gaap:AssetsCurrent
  current_liabilities:
    - us-gaap:LiabilitiesCurrent
  total_liabilities:
    - us-gaap:Liabilities
  shareholders_equity:
    - us-gaap:StockholdersEquity
    - us-gaap:StockholdersEquityIncludingPortionAttributableToNoncontrollingInterest
  long_term_debt:
    - us-gaap:LongTermDebtNoncurrent
    - us-gaap:LongTermDebt
  short_term_debt:
    - us-gaap:ShortTermBorrowings
    - us-gaap:LongTermDebtCurrent
  receivables:
    - us-gaap:AccountsReceivableNetCurrent
  inventory:
    - us-gaap:InventoryNet
  payables:
    - us-gaap:AccountsPayableCurrent
  # Earnings-quality inputs (Phase 7d, ADR-0042).
  retained_earnings:
    - us-gaap:RetainedEarningsAccumulatedDeficit
  ppe_net:
    - us-gaap:PropertyPlantAndEquipmentNet
    - us-gaap:PropertyPlantAndEquipmentAndFinanceLeaseRightOfUseAssetAfterAccumulatedDepreciationAndAmortization

# Expected unit family per metric for the unit-consistency check (DR-024).
units:
  eps_diluted: per_share           # USD/shares
  shares_diluted_weighted: shares
  shares_outstanding: shares
  # everything else defaults to `currency` (USD)

# Footnote facts (Phase 7f, ADR-0044): exact figures the notes to the financial statements tag in
# XBRL, read first so text is summarised only where no number exists. Persisted per fiscal year by
# `footnote_builder` as `xbrl:{TICKER}:{metric}:FY{yr}`; not by the annual or quarterly builders.
# Grouped by note category (`note_taxonomy_v1`); instants at the fiscal year end unless listed in
# `footnote_flow_metrics`. A metric companyfacts lacks for the latest year is looked up in that
# 10-K's inline XBRL (companyfacts drops numeric durations such as a lease term), then recorded in
# `metric_gaps`; never stored as zero.
footnote_metrics:
  debt:
    # Maturities are separate concepts per year, not a dimension. JPM moved to the "Rolling"
    # concepts from FY2023; NVIDIA tags none (its ladder comes from per-note inline XBRL).
    debt_maturity_y1:
      - us-gaap:LongTermDebtMaturitiesRepaymentsOfPrincipalInNextTwelveMonths
      - us-gaap:LongTermDebtMaturitiesRepaymentsOfPrincipalInNextRollingTwelveMonths
    debt_maturity_y2:
      - us-gaap:LongTermDebtMaturitiesRepaymentsOfPrincipalInYearTwo
      - us-gaap:LongTermDebtMaturitiesRepaymentsOfPrincipalInRollingYearTwo
    debt_maturity_y3:
      - us-gaap:LongTermDebtMaturitiesRepaymentsOfPrincipalInYearThree
      - us-gaap:LongTermDebtMaturitiesRepaymentsOfPrincipalInRollingYearThree
    debt_maturity_y4:
      - us-gaap:LongTermDebtMaturitiesRepaymentsOfPrincipalInYearFour
      - us-gaap:LongTermDebtMaturitiesRepaymentsOfPrincipalInRollingYearFour
    debt_maturity_y5:
      - us-gaap:LongTermDebtMaturitiesRepaymentsOfPrincipalInYearFive
      - us-gaap:LongTermDebtMaturitiesRepaymentsOfPrincipalInRollingYearFive
    debt_maturity_after:
      - us-gaap:LongTermDebtMaturitiesRepaymentsOfPrincipalAfterYearFive
      - us-gaap:LongTermDebtMaturitiesRepaymentsOfPrincipalInRollingAfterYearFive
    debt_weighted_avg_rate:
      - us-gaap:LongtermDebtWeightedAverageInterestRate
      - us-gaap:DebtWeightedAverageInterestRate
    revolver_capacity:
      - us-gaap:LineOfCreditFacilityMaximumBorrowingCapacity
  leases:
    operating_lease_liability:
      - us-gaap:OperatingLeaseLiability
    finance_lease_liability:
      - us-gaap:FinanceLeaseLiability
    operating_lease_wa_term_years:
      - us-gaap:OperatingLeaseWeightedAverageRemainingLeaseTerm1  # inline XBRL only
    operating_lease_wa_discount_rate:
      - us-gaap:OperatingLeaseWeightedAverageDiscountRatePercent
    lease_payments_y1:
      - us-gaap:LesseeOperatingLeaseLiabilityPaymentsDueNextTwelveMonths
    lease_payments_y2:
      - us-gaap:LesseeOperatingLeaseLiabilityPaymentsDueYearTwo
    lease_payments_y3:
      - us-gaap:LesseeOperatingLeaseLiabilityPaymentsDueYearThree
    lease_payments_y4:
      - us-gaap:LesseeOperatingLeaseLiabilityPaymentsDueYearFour
    lease_payments_y5:
      - us-gaap:LesseeOperatingLeaseLiabilityPaymentsDueYearFive
    lease_payments_after:
      - us-gaap:LesseeOperatingLeaseLiabilityPaymentsDueAfterYearFive
    lease_payments_total:
      - us-gaap:LesseeOperatingLeaseLiabilityPaymentsDue
  income_taxes:
    effective_tax_rate_reported:
      - us-gaap:EffectiveIncomeTaxRateContinuingOperations
    unrecognized_tax_benefits:
      - us-gaap:UnrecognizedTaxBenefits
    valuation_allowance:
      - us-gaap:DeferredTaxAssetsValuationAllowance
  commitments_contingencies:
    purchase_obligations:
      - us-gaap:PurchaseObligation
      - us-gaap:UnrecordedUnconditionalPurchaseObligationBalanceSheetAmount
    legal_accrual:
      - us-gaap:LossContingencyAccrualAtCarryingValue
  stock_comp:
    unrecognized_sbc_cost:
      - us-gaap:EmployeeServiceShareBasedCompensationNonvestedAwardsTotalCompensationCostNotYetRecognized

footnote_flow_metrics:
  - effective_tax_rate_reported

# Footnote units that are not USD (stored as the decimal XBRL value: 0.0438 = 4.38%).
footnote_units:
  debt_weighted_avg_rate: ratio
  operating_lease_wa_discount_rate: ratio
  effective_tax_rate_reported: ratio
  operating_lease_wa_term_years: years
