# Prometheus scrape + rule config for a real deployment (ADR-0021). Local dev doesn't need this
# running — `/metrics` is scrapeable directly or inspected with curl; this wires it up for real.
global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alerts.rules.yml

scrape_configs:
  - job_name: investilens-api
    static_configs:
      - targets: ["api:8000"]
