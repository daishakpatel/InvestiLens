name: E2E

# Tier-2 suite (ADR-0019): the §30.3 happy path + axe accessibility scan against a running,
# seeded stack. Manual/on-demand so the per-PR gate stays fast and never flakes on browser infra.
# Report generation + chat need an LLM; set LLM_API_KEY (or run with the Fake LLM seed) in repo
# secrets for a full run. Without it, the report/chat steps of the happy path will not complete.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: assay_desk
          POSTGRES_USER: assay_desk
          POSTGRES_PASSWORD: assay_desk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U assay_desk"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://assay_desk:assay_desk@localhost:5432/assay_desk
      PROVIDER_MODE: mock
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install backend + migrate + seed
        working-directory: backend
        run: |
          uv sync --locked
          uv run alembic upgrade head
          uv run python ../scripts/seed.py

      - name: Start API
        working-directory: backend
        run: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 &

      - name: Build + preview frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npx vite preview --host 0.0.0.0 --port 5173 &

      - name: Run Playwright + axe
        working-directory: e2e
        env:
          E2E_BASE_URL: http://localhost:5173
        run: |
          npm install
          npm run install-browsers
          npm test

      # Visual regression needs only the frontend: API responses are replayed from a recording.
      # Baselines are per operating system and the committed ones are macOS, so on this runner
      # the first run has nothing to compare with: it writes Linux baselines and uploads them
      # for review. Commit them and this step becomes a real comparison.
      - name: Visual regression
        working-directory: e2e
        env:
          E2E_BASE_URL: http://localhost:5173
        run: npm run visual -- --update-snapshots=missing

      - name: Upload visual results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression
          path: |
            e2e/tests/visual.spec.ts-snapshots/
            e2e/test-results/
          if-no-files-found: ignore
