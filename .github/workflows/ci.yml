name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16  # Postgres 16 + pgvector (ADR-0002)
        env:
          POSTGRES_DB: investilens
          POSTGRES_USER: investilens
          POSTGRES_PASSWORD: investilens
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U investilens"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine  # the real-Redis rate-limit test (ADR-0022); skips if absent
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://investilens:investilens@localhost:5432/investilens
      REDIS_URL: redis://localhost:6379/0
      PROVIDER_MODE: mock  # no real network calls in the default test suite (DR-004)
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check . ../scripts
      - run: uv run ruff format --check . ../scripts
      - run: uv run mypy
      # Unit + integration + migration under coverage, with the hard gate (ADR-0019, NFR-013):
      # >=80% overall and 100% on finance/ + citation/. Migration tests use the postgres service.
      - run: uv run pytest --cov=app --cov-report=term-missing
      - run: uv run coverage report --fail-under=80
      - run: uv run coverage report --include="app/finance/*,app/citation/*" --fail-under=100
      # Dependency scanning (SEC-009): fails the build on an unaddressed known vulnerability.
      - run: uv run pip-audit --strict

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test  # Vitest unit tests (pure modules: schemas, citations, format)
      - run: npm run build
      # Dependency scanning (SEC-009): --omit=dev keeps dev-tooling CVEs (which ship to no one)
      # from blocking a release build; `high` matches the backend pip-audit's default severity.
      - run: npm audit --omit=dev --audit-level=high

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # gitleaks scans full history, not just the diff (SEC-001)
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Build the deploy images (spec §31.2 "build images") so a Dockerfile break fails CI, not the
  # deploy. No push — publishing happens on Render's own build from the blueprint.
  build-images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - name: Build backend image
        run: docker build -f backend/Dockerfile -t investilens-api:ci .
      - name: Build frontend image
        run: docker build -f frontend/Dockerfile -t investilens-frontend:ci frontend
      # Scan the built backend image for OS/library CVEs (SEC-009 container scanning).
      - name: Scan backend image (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: investilens-api:ci
          severity: HIGH,CRITICAL
          exit-code: "0"  # report-only for now; flip to "1" to gate once a baseline is clean

  # The §18.4 eval smoke gate runs as the `test_eval_runner` integration test inside the `backend`
  # job (it seeds a company, runs the smoke set, and fails on a deliberate citation regression —
  # ADR-0020). Kept there rather than as a bespoke step so it reuses the Postgres service and needs
  # no live keys. The nightly full eval runs via the Celery `run_eval_suite` beat task (Phase 5b).
