# Render Blueprint for the public demo (Phase 5d ADR-0023; trimmed to the cheapest always-on
# shape by Phase 7l ADR-0050). Managed Postgres+pgvector, managed Redis, the API, ONE worker that
# serves every queue and runs Beat in-process, and the frontend as a static site — about $30/mo
# (docs/costs.md). Deploy steps: docs/deploy-demo.md (`make deploy-demo`).
#
# DEMO_MODE (ADR-0050): fixture data only (PROVIDER_MODE=mock; ADR-0007 forbids showing licensed
# prices publicly), recorded LLM answers only, no registration (one shared sandbox account wiped
# nightly), and IP-keyed rate limits. No model or data-provider keys are set: none are needed.

databases:
  - name: investilens-db
    plan: basic-256mb
    postgresMajorVersion: "16"
    # pgvector ships with Render Postgres 16; the initial Alembic migration enables it.

services:
  - type: redis
    name: investilens-redis
    plan: starter
    maxmemoryPolicy: noeviction # broker must not drop queued tasks
    ipAllowList: [] # internal only

  - type: web
    name: investilens-api
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /api/v1/health
    # Migrate, then seed the fixtures once (a no-op when already seeded) before taking traffic.
    preDeployCommand: alembic upgrade head && python ../scripts/seed_demo.py --if-empty --with-reports
    envVars: &backend_env
      - key: DATABASE_URL
        fromDatabase: {name: investilens-db, property: connectionString}
      - key: REDIS_URL
        fromService: {name: investilens-redis, type: redis, property: connectionString}
      - key: CELERY_BROKER_URL
        fromService: {name: investilens-redis, type: redis, property: connectionString}
      - key: CELERY_RESULT_BACKEND
        fromService: {name: investilens-redis, type: redis, property: connectionString}
      - key: DEMO_MODE
        value: "true"
      - key: PROVIDER_MODE
        value: mock
      - key: BACKGROUND_JOBS_ENABLED
        value: "true"
      - key: CACHE_ENABLED
        value: "true"
      - key: RATE_LIMIT_BACKEND
        value: redis # shared across the API's processes
      - key: RATE_LIMIT_PER_MINUTE
        value: "300" # per IP; one page fans out into ~20 calls, and 120 tripped the guided path
      - key: HSTS_ENABLED
        value: "true"
      - key: CORS_ALLOWED_ORIGINS
        value: '["https://investilens-frontend.onrender.com"]'
      - key: JWT_SECRET
        generateValue: true

  - type: worker
    name: investilens-worker
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    plan: starter
    # One process for all queues plus Beat (-B): the per-queue split only matters under load.
    dockerCommand: celery -A app.tasks.celery_app worker -B -Q interactive,ingestion,batch -c 2 -n demo@%h
    envVars: *backend_env

  - type: web
    name: investilens-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://investilens-api.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
